[project]
name = "streamstate"
version = "0.1.0"
description = "Exact in-backward momentum without a gradient buffer: Muon-style training at 4 bytes per parameter"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["torch>=2.6", "triton>=3.2", "numpy"]

[project.optional-dependencies]
bench = ["torchvision"]
test = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
